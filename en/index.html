        var summon = document.getElementById('mascot-summon');

        function pick(list) {
            return list[Math.floor(Math.random() * list.length)];
        }

        var POKE = [
            '关注塔菲喵～',
            '关注塔菲谢谢喵！',
            '诶嘿，被你戳到了～',
            '再戳的话塔菲要生气了喵！',
            '塔菲在这里陪你哦～',
            '今天也要元气满满！'
        ];
        var IDLE = [
            '要不要看看主人最近写的文章？',
            '学习累了就休息一下吧～',
            '右边有分类和归档，找文章更方便哦～',
            '累了就去 B 站看看主人的视频吧～',
            '关注塔菲喵～'
        ];
        var MENU = {
            '主页': '点这里回到首页～',
            '关于': '想知道主人是谁吗？',
            'Archives': '文章都整理在归档里啦！',
            'Search': '找不到想看的？搜一搜吧！',
            'Links': '这里是主人的朋友们哦～'
        };

        function greeting() {
            var h = new Date().getHours();
            if (h >= 5 && h < 11) return '早上好！今天也要元气满满哦～';
            if (h >= 11 && h < 14) return '中午好，记得按时吃饭喵～';
            if (h >= 14 && h < 18) return '下午好，学累了就歇一会儿吧～';
            if (h >= 18 && h < 23) return '晚上好，今天过得怎么样？';
            return '这么晚还没睡吗？熬夜会变成熊猫的！';
        }

        var hideTimer = 0;
        var lastSaid = 0;

        
        function say(text, strong, ms) {
            bubble.textContent = '';
            var parts = text.split('{}');
            bubble.appendChild(document.createTextNode(parts[0]));
            if (strong !== undefined) {
                var b = document.createElement('strong');
                b.textContent = strong;
                bubble.appendChild(b);
                bubble.appendChild(document.createTextNode(parts[1] || ''));
            }
            bubble.classList.add('show');
            lastSaid = Date.now();
            clearTimeout(hideTimer);
            hideTimer = setTimeout(function () { bubble.classList.remove('show'); }, ms || 4500);
        }

        function show() { root.hidden = false; summon.hidden = true; }
        function hide() { root.hidden = true; summon.hidden = false; }

        var hiddenAt = Number(localStorage.getItem(HIDE_KEY));
        if (hiddenAt && Date.now() - hiddenAt < HIDE_MS) {
            hide();
        } else {
            localStorage.removeItem(HIDE_KEY);
            show();
            setTimeout(function () { say(greeting()); }, 600);
            setTimeout(function () { say('欢迎来到{}！', '左岚の博客'); }, 6000);
        }

        document.getElementById('mascot-close').addEventListener('click', function () {
            say('那塔菲先去休息啦，有事再叫我喵～', undefined, 1500);
            setTimeout(function () {
                localStorage.setItem(HIDE_KEY, String(Date.now()));
                hide();
            }, 1500);
        });

        summon.addEventListener('click', function () {
            localStorage.removeItem(HIDE_KEY);
            show();
            say('塔菲回来啦！');
        });

        figure.addEventListener('click', function () {
            figure.classList.remove('poke');
            void figure.offsetWidth; 
            figure.classList.add('poke');
            say(pick(POKE));
        });

        
        var lastTarget = null;
        document.addEventListener('mouseover', function (e) {
            var t = e.target.closest && e.target.closest('a, button, input, #dark-mode-toggle');
            if (!t || t === lastTarget || root.contains(t) || t === summon) return;
            lastTarget = t;

            var text = t.textContent.trim();
            var href = t.getAttribute('href') || '';
            if (t.closest('.article-title')) {
                say('要看看{}这篇文章吗？', text);
            } else if (t.closest('.article-category')) {
                say('要去看看「{}」分类吗？', text);
            } else if (t.closest('#main-menu') && MENU[text]) {
                say(MENU[text]);
            } else if (t.id === 'dark-mode-toggle') {
                say('要换个颜色模式吗？晚上用暗色眼睛更舒服哦～');
            } else if (t.closest('.search-form')) {
                say('在找什么呢？输入关键词试试吧！');
            } else if (t.id === 'hitokoto_text') {
                say('点一下可以换一句哦～');
            } else if (t.closest('.widget.archives')) {
                say('按年份翻翻主人的旧文章吧～');
            } else if (href.indexOf('bilibili.com') >= 0) {
                say('这是主人的哔哩哔哩，记得一键三连喵！');
            } else if (href.indexOf('github.com') >= 0) {
                say('要去 GitHub 看看吗？');
            } else if (href.indexOf('csdn.net') >= 0) {
                say('主人在 CSDN 也有写文章哦～');
            } else if (href.indexOf('zhihu.com') >= 0) {
                say('这是主人的知乎～');
            }
        });

        document.addEventListener('mouseout', function (e) {
            var r = e.relatedTarget;
            if (!(r && r.closest && r.closest('a, button, input, #dark-mode-toggle'))) lastTarget = null;
        });

        
        setInterval(function () {
            if (root.hidden || document.hidden || Date.now() - lastSaid < 30000) return;
            say(pick(IDLE));
        }, 10000);
    })();
</script>
